name: Build and Release Agent2API for fnOS

# 构建 fnOS 应用包（.fpk）并挂到 GitHub Release 上。
#
# ── 这个仓库里有什么、缺什么 ──────────────────────────────────
# 本仓库只有**飞牛适配层**（fngateway 反向代理、cmd/ 生命周期脚本、config/、
# wizard/、manifest、桌面入口与图标）。上游 WebUI 自 2026-10-20 起也不入库，
# 构建时从官方包注入（见 build.py 的 stage_ui）。
# 它**不含**上游源码 —— 上游 aimod-cc/Agent2API 是 Rust 单文件二进制，
# 二进制与面板都由上游自己发布。
#
# 所以 CI 干两件事：
#   1. binaries job: 下载上游**官方** Linux 服务端包（校验 sha256）→ 取二进制，
#                    并就地编 fngateway（Go）
#   2. package job : 把二进制喂进 build.py → 出 fpk
# 本地开发不必装 Rust —— 二进制由上游发布，用 `python build.py --fetch-binaries`
# 拉到 .local-build/bin/ 即可（CI 走的是同一条路径）。
#
# ── 二进制怎么来的（2026-10-31 起：两种模式）──────────────────
# 上游发版有两种形态，本 workflow 都覆盖，两种都出 .fpk 并发布到 Release：
#
#   mode=release（默认）：上游 Release 带官方 Linux 服务端包
#     agent2api-server-linux-<arch>.tar.gz + 同名 .sha256
#     → `python build.py --fetch-binaries` 下载（GitHub 直连 + 两个加速源兜底）
#       → 按 build.py 里钉死的 UPSTREAM_BUNDLE_SHA256 校验 → 解包落 .local-build/bin/
#
#   mode=source：上游只打了 tag、没发 Release 资产（实测 v3.3.0-beta.5.1：
#     tag 在、releases 里没有它）
#     → 本 job 就地编译：cargo build --release --locked -p agent2api-server，
#       amd64 原生 + arm64 交叉（ubuntu-22.04 + gcc-aarch64-linux-gnu），
#       产物落 .local-build/bin/；面板由 build.py 从同一 tag 源码就位。
#
# 模式由 build.py 的 UPSTREAM_BUNDLE_MODE 决定（tools/bump_upstream.py 升级时按
# 「该 tag 有没有官方包资产」写入并提交），本 workflow 只问一次：
#     python3 build.py --print-mode
# Rust 工具链**只在 source 模式**安装，release 模式的耗时不变。
#
# 失败模式（都在 build.py 里硬失败，不会产出一个错包）：
#   · release 模式：上游删/换资产（三个地址都 404，或 sha256 不符）→ 退出 1
#     （sha256 不符说明上游重新上传了同 tag 的包：这时要人工核对后跑
#      tools/bump_upstream.py --apply 重新钉哈希）
#   · source 模式：源码结构与预期不符 / Cargo.toml 版本与 tag 不一致 → 退出 1
#   · 两种模式：包内缺二进制或缺 ui/ → 退出 1
#
# ── 为什么仍然钉 ubuntu-22.04 ─────────────────────────────────
# fngateway 是本 job 就地编的 Go 程序（CGO_ENABLED=0，纯静态，与 glibc 无关），
# 但 **source 模式的 agent2api-server 是本 job 就地编的 Rust 程序**，它的 glibc
# 下限完全由 runner 决定；release 模式下则是上游编的（实测最高引用 GLIBC_2.34）。
# 两种都低于飞牛 Debian 12 的 2.36，但漂移必须能被看见：
#   ubuntu-22.04 → glibc 2.35   ✅ 低于 2.36，安全
#   ubuntu-24.04 → glibc 2.39   ❌ 产物会在飞牛上报
#                                  "version `GLIBC_2.38' not found"
# 这个坑不会在构建期报错，只在真机启动时炸，所以保留 Verify binaries 那道断言。
# package job 不产二进制，跑在 ubuntu-24.04 上无所谓。
#
# ── 触发方式 ──────────────────────────────────────────────────
#   · push tag v*：构建 + 发布 Release（含 fpk 与 SHA256SUMS.txt）
#   · workflow_dispatch（ref=tag）：与上面等价，由 check-upstream.yml 派发。
#     **自动升级走的就是这条路**：定时检查发现上游新版 → 改 pin/manifest →
#     提交 main → 打 tag → 派发本 workflow。之所以要「派发」而不是直接
#     push tag 让它自动触发，是因为用 GITHUB_TOKEN 推的 tag 不会触发其它
#     workflow（GitHub 防递归规则），只有 workflow_dispatch /
#     repository_dispatch 两个事件例外。详见 check-upstream.yml 的文件头。
#   · workflow_dispatch（ref=分支）：只构建，产物作为 artifact 下载，
#     不发布 Release（github.ref 不是 refs/tags/*，Release 步骤自动跳过）。
#     要在此情况下也发布，勾 force_release。
#   · pull_request：只构建，不发布
#
# ── 发布用的凭据 ──────────────────────────────────────────────
# 用 Actions 内置的 secrets.GITHUB_TOKEN，不需要额外配 PAT —— 顶层
# permissions: contents: write 已经给它 Release 写权限。
# 也正因为用的是内置 token，本 workflow 不能靠 push tag 触发，只能被派发
# 或手动触发（见上）。

on:
  push:
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      # 网页手动触发时 ref 只能选分支或 tag。选分支时 github.ref 不是
      # refs/tags/*，下面「Create Release」默认跳过 —— 这个开关用来在分支上
      # 也发一版（tag 名取 manifest 里的版本号，不存在则自动创建）。
      force_release:
        description: '即使在分支上也创建 Release（tag 用 manifest 里的版本号）'
        type: boolean
        default: false

permissions:
  contents: write

env:
  # 上游官方服务端包的解包目录与二进制落点都由 build.py 决定（.local-build/，
  # 已在 .gitignore 中）；这里不再维护 SRC_DIR / TARGET_DIR 这类 Rust 专用路径。
  # 关掉字节码缓存：本 workflow 每步只跑一次 Python，缓存没有收益，
  # 却可能让「build.py 改了但读到旧常量」变得隐蔽（见 tools/check_bump_reload.py）。
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  # ── 取上游产物（官方包或 tag 源码自编）+ 编 fngateway（amd64 + arm64）──
  binaries:
    name: Fetch upstream binaries + build fngateway
    runs-on: ubuntu-22.04
    # source 模式冷编译 Rust 约 10 分钟；给缓存留足余量，别让超时砍掉一次有效构建。
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version from manifest
        run: |
          APP_VERSION=$(grep '^version[[:space:]]*=' manifest | sed 's/^version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: Failed to read version from manifest"
            exit 1
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}"

      # fngateway 是纯标准库 Go 程序，CGO_ENABLED=0 即纯静态，
      # 目标机 glibc 版本与它无关。
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      # build.py 需要 Python 3.12：解包用 tarfile 的 filter="data"
      # （3.12+ 才有该参数；低版本走 except TypeError 的兜底但仍建议对齐）。
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 先问产物形态：Rust 工具链只在 source 模式装，release 模式一行都不多跑。
      # 这个值来自仓库里提交的 build.py 常量（bump_upstream.py 升级时写入），
      # 不是本 workflow 现场判断的 —— 保证「包是怎么来的」在 git 历史里可审计。
      - name: Resolve upstream mode (release or source)
        id: mode
        run: |
          set -euo pipefail
          MODE=$(python3 build.py --print-mode)
          case "$MODE" in
            release|source) ;;
            *) echo "ERROR: build.py --print-mode 返回了意外值: $MODE"; exit 1 ;;
          esac
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "source" ]; then
            echo "上游该 tag 没有官方 Linux 包 —— 本 job 将用 tag 源码交叉编译 agent2api-server"
          else
            echo "上游该 tag 有官方 Linux 包 —— 直接下载并校验钉住的 sha256"
          fi

      # ── source 模式：拉源码 + 交叉编译 agent2api-server ──────────
      # arm64 需要 aarch64 的 C 工具链与 glibc 开发头文件 —— rusqlite 的
      # bundled SQLite 与 ring 的 C/汇编源码要用 C 编译器。libc6-dev-arm64-cross
      # 只是 gcc-aarch64-linux-gnu 的 Recommends，--no-install-recommends 下必须
      # 显式列出，否则编 C 代码时会捡到宿主的 /usr/include 头文件而报错。
      - name: source mode · setup Rust
        if: steps.mode.outputs.mode == 'source'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: source mode · install arm64 cross toolchain
        if: steps.mode.outputs.mode == 'source'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu libc6-dev-arm64-cross
          aarch64-linux-gnu-gcc --version | head -1

      # 源码落 .local-build/upstream-src/（build.py 的 fetch_upstream 决定），
      # 并核对 Cargo.toml 版本 == 当前 pin（防 tag 被移动或镜像给了旧包）。
      - name: source mode · fetch upstream source
        if: steps.mode.outputs.mode == 'source'
        run: python3 build.py --fetch-source

      # 缓存 Rust 依赖：冷编译约 10 分钟，命中后只剩源码层重编。
      # workspaces 的写法是 `$workspace -> $target`，$target 相对 $workspace；
      # 从 src-tauri 往上四层就是仓库根。
      - name: source mode · cache Rust dependencies
        if: steps.mode.outputs.mode == 'source'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .local-build/upstream-src/desktop-tauri/src-tauri -> ../../../../.local-build/target
          key: upstream-${{ github.ref_name }}

      # --locked：依赖版本按上游 Cargo.lock，不现场解析。
      # 产物目录放 .local-build/（已被 build.py 的文本卫生与打包扫描排除），
      # 不要落在仓库根 —— 那里的 target/ 会被当成待检文本，一次 cargo build
      # 就能让 check_text_hygiene() 报上千项「末尾缺换行」。
      - name: source mode · cargo build agent2api-server (both arches)
        if: steps.mode.outputs.mode == 'source'
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
        run: |
          set -euo pipefail
          cd .local-build/upstream-src/desktop-tauri/src-tauri
          BIN_DIR="${GITHUB_WORKSPACE}/.local-build/bin"
          TGT="${GITHUB_WORKSPACE}/.local-build/target"
          mkdir -p "$BIN_DIR"

          echo "==> agent2api-server linux/amd64 (native)"
          cargo build --release --locked -p agent2api-server --target-dir "$TGT"
          cp "$TGT/release/agent2api-server" "$BIN_DIR/agent2api-server-linux-amd64"

          echo "==> agent2api-server linux/arm64 (cross)"
          cargo build --release --locked -p agent2api-server \
            --target aarch64-unknown-linux-gnu --target-dir "$TGT"
          cp "$TGT/aarch64-unknown-linux-gnu/release/agent2api-server" \
             "$BIN_DIR/agent2api-server-linux-arm64"
          ls -l "$BIN_DIR"

      # ── 两种模式汇合：就位上游产物 ──────────────────────────────
      # build.py 按 UPSTREAM_BUNDLE_MODE 分流：
      #   release → 下载官方包（GitHub 直连 + v4.gh-proxy.org + gh.dpik.top 兜底），
      #             校验 build.py 里钉死的 UPSTREAM_BUNDLE_SHA256，不符即硬失败并
      #             删掉坏包（防止下次被缓存复用掩盖问题）；解包后把二进制复制成
      #             .local-build/bin/agent2api-server-linux-<arch>（fngateway 的
      #             startChild() 与 build.py 的 bin_paths() 都按这个名字找）；
      #   source  → 从 tag 源码把面板按官方包布局就位到
      #             .local-build/upstream-bundle-<arch>/ui/，并给刚编好的二进制
      #             写出溯源 sidecar。两种来源在下游完全同形。
      # --force-upstream 不在 CI 用：runner 每次都是干净的，没有缓存需要绕过。
      - name: Fetch upstream server bundles (mode-aware)
        run: python3 build.py --fetch-binaries

      - name: Build fngateway (Go, both arches)
        run: |
          cd fngateway
          mkdir -p ../.local-build/bin
          export CGO_ENABLED=0 GOOS=linux GOFLAGS=-mod=mod
          for arch in amd64 arm64; do
            echo "==> fngateway linux/${arch}"
            GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${APP_VERSION}" \
              -o "../.local-build/bin/fngateway-linux-${arch}" .
            ls -l "../.local-build/bin/fngateway-linux-${arch}"
          done

      # 二进制自检：ELF 架构对不对、要求的 glibc 有没有超过飞牛的 2.36。
      # 这两项错了都不会在构建期报错，只在真机上「装完起不来」。
      #
      # build.py 的 check_binaries() 已经查了一遍，这里**故意再查一遍**：
      #   · agent2api-server 是 CI 里唯一的外部/自编关键二进制，一份独立的、
      #     不依赖 build.py 实现的断言，能在 build.py 被人改坏时仍然兜住；
      #   · 它同时覆盖本 job 自己编的 fngateway（build.py 的 glibc 检查
      #     对两个二进制都做，但这里用的是系统 readelf/objdump，独立实现）。
      # 开销只有几秒。
      - name: Verify binaries (arch + glibc)
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -e
          MAX_GLIBC="2.36"   # 飞牛 fnOS 1.2.x = Debian 12 bookworm

          expect_machine() {
            case "$1" in
              amd64) echo "Advanced Micro Devices X86-64" ;;
              arm64) echo "AArch64" ;;
            esac
          }

          fail=0
          for arch in amd64 arm64; do
            for name in "fngateway-linux-${arch}" "agent2api-server-linux-${arch}"; do
              bin=".local-build/bin/${name}"
              if [ ! -f "$bin" ]; then
                echo "ERROR: 缺少 ${bin}"; fail=1; continue
              fi
              head4=$(head -c4 "$bin" | od -An -tx1 | tr -d ' \n')
              if [ "$head4" != "7f454c46" ]; then
                echo "ERROR: ${name} 不是 ELF (magic=${head4})"; fail=1; continue
              fi
              got=$(readelf -h "$bin" | awk -F: '/Machine/{print $2}' | sed 's/^ *//')
              want=$(expect_machine "$arch")
              if [ "$got" != "$want" ]; then
                echo "ERROR: ${name} 架构不符: 期望 '${want}', 实际 '${got}'"; fail=1
              fi

              # 防「替身二进制」混进包：本地无 Rust 时曾用 Go 占位程序顶上，
              # 它 1.5 MB、静态无依赖，**能通过下面所有 glibc 检查**，装上
              # 真机才会 exit status 1。Rust 会把自己的编译器版本写进二进制，
              # 拿它当指纹 + 一条体积下限，双保险。
              # 上游官方 v3.1.0 包实测 13.75 MB（amd64）/ 12.09 MB（arm64），
              # 都远高于下限；下限取 8 MB，给上游瘦身留余量又不至于放过占位品。
              if [ "${name#agent2api-server}" != "$name" ]; then
                if ! grep -qa 'rustc' "$bin"; then
                  echo "ERROR: ${name} 未见 rustc 标记，疑似占位/替身二进制"; fail=1
                fi
                if [ "$(stat -c%s "$bin")" -lt 8000000 ]; then
                  echo "ERROR: ${name} 仅 $(stat -c%s "$bin") B，远小于真实产物（约 12~14 MB）"
                  fail=1
                fi
              fi

              worst=$(objdump -T "$bin" 2>/dev/null \
                        | grep -o 'GLIBC_[0-9][0-9.]*' | sort -uV | tail -1 || true)
              size=$(stat -c%s "$bin")
              if [ -z "$worst" ]; then
                echo "  ${name}: ${size} B  ${arch}  (无动态 glibc 依赖)"
                continue
              fi
              if [ "$(printf '%s\n%s\n' "GLIBC_${MAX_GLIBC}" "$worst" | sort -V | tail -1)" != "GLIBC_${MAX_GLIBC}" ]; then
                echo "ERROR: ${name} 要求 ${worst} > 允许的 GLIBC_${MAX_GLIBC}"
                echo "       飞牛 fnOS 上会报 \"version \`${worst#GLIBC_}' not found\"。"
                if [ "${name#agent2api-server}" != "$name" ]; then
                  if [ "${MODE:-release}" = "source" ]; then
                    echo "       这是本 job 用 tag 源码交叉编译的产物 —— glibc 基线由 runner"
                    echo "       镜像决定，请确认本 job 仍钉在 ubuntu-22.04（见文件头注释）。"
                  else
                    echo "       这是上游官方包里的二进制 —— 说明上游提高了 glibc 基线。"
                    echo "       请人工确认飞牛是否已跟进（Debian 13 = glibc 2.41），"
                    echo "       或暂缓升级并回报上游。"
                  fi
                else
                  echo "       请把本 job 的 runner 换回更低 glibc 的镜像（见文件头注释）。"
                fi
                fail=1
              else
                echo "  ${name}: ${size} B  ${arch}  最高要求 ${worst} <= GLIBC_${MAX_GLIBC} OK"
              fi
            done
          done
          exit $fail

      # 启动冒烟：只看 ELF 头、体积、glibc 是发现不了「编译通过、启动即崩」的
      # —— 上游 v3.3.0-beta.5 就是这样：headless 入口在创建 Tokio 运行时之前
      # 裸 tokio::spawn，release 是 panic=abort，进程当场退出
      # （"there is no reactor running"），真机表现是「应用起来就死」。
      # source 模式下这条更关键：二进制是本 job 自己编的，语法/链接都对也不代表
      # 跑得起来。只跑 amd64 —— arm64 是交叉编译产物，这里没有 qemu。
      # 判定两条，缺一不可：
      #   1) 进程能起来并且 /health 200（20 秒内）；
      #   2) 日志里没有 "no reactor running"（beta.5 的 panic 原话）。
      - name: Smoke test (headless, amd64)
        run: |
          set -uo pipefail
          TMP=$(mktemp -d)
          BIN="$GITHUB_WORKSPACE/.local-build/bin/agent2api-server-linux-amd64"
          LOG="$TMP/out.log"

          AGENT2API_PROXY_HOME="$TMP/data" \
          AGENT2API_HOST=127.0.0.1 \
          AGENT2API_PROXY_PORT=39999 \
          AGENT2API_UI_DIR="$TMP/ui" \
          AGENT2API_ALLOW_NO_KEY=1 \
            "$BIN" > "$LOG" 2>&1 &
          PID=$!

          OK=0
          for i in $(seq 1 20); do
            if curl -fsS -m 2 http://127.0.0.1:39999/health >/dev/null 2>&1; then
              OK=1; break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "进程在 /health 就绪前已退出"; break
            fi
            sleep 1
          done

          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

          echo "===== 上游输出 ====="
          cat "$LOG"
          echo "===================="

          if grep -q "no reactor running" "$LOG"; then
            echo "ERROR: 命中 v3.3.0-beta.5 那类启动 panic（there is no reactor running）"
            exit 1
          fi
          if [ "$OK" != "1" ]; then
            echo "ERROR: /health 在 20 秒内未就绪"
            exit 1
          fi
          echo "冒烟通过：headless 起得来，/health 200，无 reactor panic"

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: linux-binaries
          path: .local-build/bin/*
          if-no-files-found: error
          retention-days: 7

  # ── 打包 .fpk 并发布 ─────────────────────────────────────────
  package:
    name: Package fpk
    needs: binaries
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read version from manifest
        run: |
          APP_VERSION=$(grep '^version[[:space:]]*=' manifest | sed 's/^version[[:space:]]*=[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$APP_VERSION" ]; then
            echo "ERROR: Failed to read version from manifest"
            exit 1
          fi
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      # 只为了在 Summary 里写明「这一版二进制是官方包还是自编」——
      # 交付物本身已经把这个事实写在包内 UPSTREAM.txt 里，这里只是让它显眼。
      - name: Resolve upstream mode (for summary)
        id: mode
        run: |
          MODE=$(python3 build.py --print-mode)
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "上游产物形态: $MODE"

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: linux-binaries
          path: .local-build/bin

      - name: Download fnpack
        run: |
          FNPACK_URL="https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64"
          mkdir -p .local-build/tools
          wget -q "$FNPACK_URL" -O .local-build/tools/fnpack
          if [ ! -s .local-build/tools/fnpack ]; then
            echo "ERROR: fnpack download failed or file is empty"
            exit 1
          fi
          chmod +x .local-build/tools/fnpack
          echo "fnpack downloaded ($(stat -c%s .local-build/tools/fnpack) bytes)"

      # 刷新 app/ui 到「进包形态」并跑全部预检。面板来源同样由模式决定：
      #   release → 官方包里的 ui/（与二进制同出一次上游发布）；
      #   source  → 该 tag 源码的 desktop-tauri/ui（两种来源实测逐字节一致）。
      # 这一步同时是**上游漂移探针**：拿到的面板若与 build.py 钉住的树哈希不一致，
      # verify_webui_provenance() 会硬失败，逼我们人工确认「面板形态是否还是
      # fngateway 能改写的那一种」（升级路径上由 bump_upstream.py 重算并改钉子，
      # 所以这条主要拦的是「面板在别处被悄悄改动」）。
      #
      # 注意它只写 app/ui、不碰 .local-build/bin —— 二进制来自上面的
      # Download binaries 步骤（binaries job 的产物），不会被这一步覆盖。
      # source 模式下这一步会顺带下载 tag 源码（面板的来源），不装 Rust。
      - name: Sync upstream UI + preflight checks
        run: python3 build.py --sync-upstream

      # 与本地构建走的是同一条打包路径（build.py），CI 只负责把二进制喂进
      # .local-build/bin —— 本地与 CI 不会出现「两边包不一样」。
      #
      # SOURCE_DATE_EPOCH 用提交时间：build.py 写进 UPSTREAM.txt 的构建时间戳
      # 会跟着它走，同一 commit 重跑得到同样的内容。
      # 注意 fpk **不是**逐字节可复现的 —— fnpack 自己的 tar 元数据（mtime/uid）
      # 与 gzip 层每次都不同，包内 manifest 的 checksum 字段也随之变。
      # 已实测：app.tgz 内 78 个文件的内容哈希逐字节一致，差异只在打包层。
      - name: Set reproducible timestamp
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> $GITHUB_ENV

      - name: Build fpk packages
        run: python3 build.py

      - name: Verify packages exist
        run: |
          ls -lh ./*.fpk
          count=$(ls -1 ./*.fpk 2>/dev/null | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "ERROR: 期望产出 2 个 fpk（amd64 + arm64），实际 ${count} 个"
            exit 1
          fi

      - name: Calculate checksums
        run: |
          sha256sum ./*.fpk > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "PACKAGE_SHA256=$(sha256sum "agent2api-${APP_VERSION}-amd64.fpk" | awk '{print $1}')" >> $GITHUB_ENV

      - name: Upload fpk artifacts
        uses: actions/upload-artifact@v7
        with:
          name: agent2api-fpk
          path: |
            *.fpk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Build summary
        run: |
          cat << EOF >> $GITHUB_STEP_SUMMARY
          ## Build Summary

          **Version:** ${APP_VERSION}

          **上游产物形态:** \`${{ steps.mode.outputs.mode }}\`
          （\`release\` = 二进制与面板取自上游官方 Linux 服务端包；
           \`source\` = 上游该 tag 未发官方包，二进制由 tag 源码交叉编译）

          **Git Info:**
          - Commit: \`${{ github.sha }}\`
          - Branch: \`${{ github.ref_name }}\`
          - Triggered by: ${{ github.event_name }}

          **Artifacts:**
          $(sed 's/^/- \`/; s/$/\`/' SHA256SUMS.txt)
          EOF

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.force_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_RELEASE: ${{ inputs.force_release }}
        run: |
          set -euo pipefail

          # 常态（tag 触发 / 被 check-upstream 以 ref=tag 派发）：用触发的 tag。
          # force_release（手动在分支上跑）：github.ref 不是 tag，此时用 manifest
          # 里的版本号现造一个 tag，否则 Release 没有可依附的 ref。
          if [ "${FORCE_RELEASE:-false}" = "true" ] \
             && ! printf '%s' "${GITHUB_REF}" | grep -q '^refs/tags/v'; then
            TAG="v${APP_VERSION}"
            echo "force_release=true 且当前 ref 是分支 —— 目标 tag: ${TAG}"
            if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
              echo "tag ${TAG} 已存在，直接复用"
            else
              git tag "${TAG}"
              git push origin "refs/tags/${TAG}"
              echo "已创建并推送 tag ${TAG}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi

          CHANGELOG=$(grep '^changelog[[:space:]]*=' manifest | sed 's/^changelog[[:space:]]*=[[:space:]]*//' | sed 's/<br>/\n/g')
          NOTES="${CHANGELOG}\n\n---\n**SHA256 (amd64):** \`${PACKAGE_SHA256}\`"

          # 重打同一个版本标签时是替换而不是失败：若同名 Release 已存在则先删除
          # （保留 tag 本身），否则 gh 会报 "release already exists" 导致
          # 「包已构建成功但发布失败」，留下 tag 与 Release 不一致的状态。
          # 这条对 check-upstream 的「自愈补发」也很关键：补发时 tag 已在，
          # 只有 Release 缺失或被删过，删除分支会跳过、创建分支会补上。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — deleting it before recreating"
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" \
            ./*.fpk \
            SHA256SUMS.txt \
            --title "$TAG" \
            --notes "$(echo -e "$NOTES")"
